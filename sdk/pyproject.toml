[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tracegrade"
version = "0.1.0"
description = "Python SDK for TraceGrade"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "TraceGrade"}]
dependencies = ["httpx==0.28.1"]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.9.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/tracegrade"]
