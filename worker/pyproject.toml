[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tracegrade-worker"
version = "0.1.0"
description = "TraceGrade Temporal worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic-settings==2.7.1",
  "temporalio==1.9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
